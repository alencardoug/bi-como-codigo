<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receita por canal e categoria</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="page.css">
<!-- bice:pins — build.py puts here the import map and the pinned classic scripts, each with its integrity -->
</head>
<body>
<main>
  <h1>Receita por canal e categoria</h1>
  <form data-bice="login">
    <label for="senha">Senha da Diretoria</label>
    <input id="senha" data-bice="password" type="password" autocomplete="off" disabled>
    <button data-bice="submit" type="submit">Entrar</button>
    <p data-bice="login-error" role="alert" hidden>Senha incorreta: nada foi aberto.</p>
    <p data-bice="engine-error" role="alert" hidden>Não foi possível carregar o motor de consulta.</p>
  </form>
  <section data-bice="report" hidden>
    <div class="controls">
      <label>Canal <select data-bice="filter"></select></label>
      <label>Mês do detalhe <select data-bice="month"></select></label>
      <button data-bice="logout" type="button">Sair</button>
    </div>
    <p data-bice="loading" hidden>Carregando…</p>
    <h2>Receita líquida por mês</h2>
    <div data-bice="chart" class="chart"></div>
  </section>
</main>
<!-- bice:entry — build.py puts here the page module, with its integrity -->
</body>
</html>
