# The Python package of this repository's own tooling — today, the checks that
# `make check` runs. The `uv.lock` next to it is the lock: it, not this file, is
# what makes two machines install exactly the same versions.

[project]
name = "bi-como-codigo"
version = "0.1.0"
description = "BI as code over the synthetic retail warehouse of mvp_eng_dados_1"
readme = "README.md"
authors = [{ name = "Douglas Alencar" }]

# The checks were ported from mvp_eng_dados_1, which runs 3.11; nothing here
# needs to pin the series, so newer interpreters are accepted.
requires-python = ">=3.11"

# Each runtime dependency enters with the stage that uses it: `cryptography`
# with the envelope of stage 2.2a (docs/encryption_envelope.md) — AES-GCM and
# AES Key Wrap; PBKDF2 comes from the standard library. `duckdb` with the
# package gate of stage 2.2b (docs/package_gate.md, N77): it reads each
# report's Parquet, pinned exactly, since its type names are part of the
# contract.
dependencies = [
    "cryptography>=46,<47",
    "duckdb==1.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "PyYAML>=6.0,<7.0",  # the register of values public by design is YAML
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bi_como_codigo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
